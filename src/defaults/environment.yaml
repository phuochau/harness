schema: harness/environment/v1
commands:
  task_verify: __TASK_VERIFY__
  full_verify: __FULL_VERIFY__
pi_packages:
  - id: harness
    dependency: pi-multi-agent-harness
    scope: project
    resources:
      extensions: [dist/pi/extension.js]
agent_plugins:
  - id: superpowers-pi
    dependency: superpowers
    agent: pi
    plugin_id: superpowers
  - id: superpowers-codex
    dependency: superpowers
    agent: codex
    plugin_id: superpowers-dev/superpowers
  - id: superpowers-devin
    dependency: superpowers
    agent: devin
    plugin_id: superpowers
  - id: superpowers-claude
    dependency: superpowers
    agent: claude
    plugin_id: superpowers@superpowers-dev
