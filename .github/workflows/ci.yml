name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  compatibility:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, harness-compat]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run compat:pi
      - run: npm run compat:speckit
      - run: npm run compat:herdr
